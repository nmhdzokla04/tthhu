<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Trung Thu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4e8d1;
            margin: 0;
            overflow: hidden;
        }
        .envelope-container {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .envelope {
            width: 300px;
            height: 200px;
            background-color: #d2b48c;
            border-radius: 5px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.8s ease-in-out;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .envelope:hover {
            transform: translateY(-10px);
        }
        .envelope-flap {
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid #a08c6f;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top;
            transition: transform 0.8s ease-in-out;
        }
        .envelope-content {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: #f4e8d1;
            border-top: 1px dashed #a08c6f;
            overflow: hidden;
            transition: height 0.8s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .letter {
            text-align: center;
            color: #333;
            padding: 20px;
            box-sizing: border-box;
            transform: translateY(50px);
            opacity: 0;
            transition: transform 0.8s ease-in-out 0.5s, opacity 0.8s ease-in-out 0.5s;
        }
        .letter h2 {
            margin-bottom: 15px;
            color: #8b4513;
            font-size: 1.5em;
        }
        .letter p {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .envelope.open .envelope-flap {
            transform: rotateX(-180deg);
        }
        .envelope.open .envelope-content {
            height: 200px;
        }
        .envelope.open .letter {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="envelope-container">
        <div class="envelope" id="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-content">
                <div class="letter">
                    <h2>Trung Thu đến rồi...</h2>
                    <p>Anh chúc em của anh một ngày Lễ Trung Thu thật vui vẻ và hạnh phúc. Luôn vui vẻ yêu đời.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mã hiệu ứng pháo hoa được thêm vào đúng vị trí
        const canvasFireworks = document.createElement('canvas');
        canvasFireworks.id = 'fireworksCanvas';
        canvasFireworks.style.position = 'fixed';
        canvasFireworks.style.top = '0';
        canvasFireworks.style.left = '0';
        canvasFireworks.style.width = '100%';
        canvasFireworks.style.height = '100%';
        canvasFireworks.style.pointerEvents = 'none';
        canvasFireworks.style.zIndex = '9999';
        document.body.appendChild(canvasFireworks);

        const ctxFireworks = canvasFireworks.getContext('2d');
        canvasFireworks.width = window.innerWidth;
        canvasFireworks.height = window.innerHeight;

        let fireworks = [];

        function Spark(x, y, color, size, speedX, speedY) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = size;
            this.speedX = speedX;
            this.speedY = speedY;
            this.life = Math.random() * 60 + 30;
            this.gravity = 0.05;
        }

        Spark.prototype.update = function() {
            this.x += this.speedX;
            this.y += this.speedY + this.gravity;
            this.size *= 0.96;
            this.life--;
        };

        Spark.prototype.draw = function(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        };

        function Firework(x, y) {
            this.x = x;
            this.y = y;
            this.sparks = [];
            const numSparks = Math.floor(Math.random() * 50) + 50;
            const colors = ['#ff5733', '#33ff57', '#5733ff', '#f4ff33', '#ff33e3', '#fff'];
            for (let i = 0; i < numSparks; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                this.sparks.push(new Spark(x, y, color, Math.random() * 3 + 1, Math.cos(angle) * speed, Math.sin(angle) * speed));
            }
        }

        Firework.prototype.update = function() {
            this.sparks.forEach(spark => spark.update());
            this.sparks = this.sparks.filter(spark => spark.life > 0);
        };

        Firework.prototype.draw = function(ctx) {
            this.sparks.forEach(spark => spark.draw(ctx));
        };

        function animate() {
            ctxFireworks.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctxFireworks.fillRect(0, 0, canvasFireworks.width, canvasFireworks.height);

            fireworks.forEach((firework, index) => {
                firework.update();
                firework.draw(ctxFireworks);
                if (firework.sparks.length === 0) {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvasFireworks.width = window.innerWidth;
            canvasFireworks.height = window.innerHeight;
        });

        canvasFireworks.addEventListener('click', (e) => {
            fireworks.push(new Firework(e.clientX, e.clientY));
        });

        window.addEventListener('load', () => {
            animate();
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    fireworks.push(new Firework(Math.random() * window.innerWidth, Math.random() * window.innerHeight / 2));
                }, i * 1000);
            }
        });

        // Sự kiện mở thư đã được sửa lỗi, đảm bảo chạy đúng
        const envelope = document.getElementById('envelope');
        if (envelope) {
            envelope.addEventListener('click', () => {
                envelope.classList.toggle('open');
            });
        } else {
            console.error("Không tìm thấy phần tử phong bì");
        }
    </script>
</body>
</html>
