<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Trung Thu</title>
    <style>
        /* CSS cho phong bì và lời chúc */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4e8d1; /* Màu nền nhẹ nhàng */
            margin: 0;
            overflow: hidden; /* Ẩn thanh cuộn */
            position: relative; /* Để các phần tử con có thể định vị tuyệt đối */
        }
        .envelope-container {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10; /* Đảm bảo phong bì ở trên các phần tử khác (trừ pháo hoa) */
        }
        .envelope {
            width: 300px;
            height: 200px;
            background-color: #d2b48c; /* Màu nâu gỗ */
            border-radius: 5px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.8s ease-in-out;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .envelope:hover {
            transform: translateY(-10px); /* Hiệu ứng nhấc lên khi rê chuột */
        }
        .envelope-flap {
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid #a08c6f; /* Màu nắp phong bì */
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top;
            transition: transform 0.8s ease-in-out;
        }
        .envelope-content {
            position: absolute;
            top: 100px; /* Bắt đầu từ đáy nắp */
            left: 0;
            width: 100%;
            height: 100px; /* Chiều cao ban đầu của phần nội dung */
            background-color: #f4e8d1;
            border-top: 1px dashed #a08c6f;
            overflow: hidden;
            transition: height 0.8s ease-in-out; /* Transition cho chiều cao */
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .letter {
            text-align: center;
            color: #333;
            padding: 20px;
            box-sizing: border-box;
            transform: translateY(50px); /* Dịch xuống ban đầu */
            opacity: 0; /* Ban đầu ẩn */
            transition: transform 0.8s ease-in-out 0.5s, opacity 0.8s ease-in-out 0.5s; /* Delay animation */
        }
        .letter h2 {
            margin-bottom: 15px;
            color: #8b4513; /* Màu nâu đậm cho tiêu đề */
            font-size: 1.5em;
        }
        .letter p {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        /* CSS khi phong bì mở */
        .envelope.open .envelope-flap {
            transform: rotateX(-180deg); /* Lật nắp */
        }
        .envelope.open .envelope-content {
            height: 200px; /* Mở rộng chiều cao để lộ thư */
        }
        .envelope.open .letter {
            transform: translateY(0); /* Về vị trí ban đầu */
            opacity: 1; /* Hiện thư */
        }

        /* CSS cho hiệu ứng pháo hoa */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Cho phép click xuyên qua canvas */
            z-index: 9999; /* Đảm bảo hiển thị trên cùng */
        }
    </style>
</head>
<body>
    <!-- Container cho phong bì -->
    <div class="envelope-container">
        <div class="envelope" id="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-content">
                <div class="letter">
                    <h2>Trung Thu đến rồi...</h2>
                    <p>Anh chúc em của anh một ngày Lễ Trung Thu thật vui vẻ và hạnh phúc. Luôn vui vẻ yêu đời.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Hiệu ứng pháo hoa -->
    <canvas id="fireworksCanvas"></canvas>

    <script>
        // --- Khởi tạo và điều khiển hiệu ứng pháo hoa ---
        const canvasFireworks = document.getElementById('fireworksCanvas');
        const ctxFireworks = canvasFireworks.getContext('2d');
        canvasFireworks.width = window.innerWidth;
        canvasFireworks.height = window.innerHeight;

        let fireworks = []; // Mảng chứa các quả pháo hoa
        let isFireworksRunning = true; // Biến theo dõi trạng thái chạy của pháo hoa

        // Hàm tạo một tia lửa
        function Spark(x, y, color, size, speedX, speedY) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = size;
            this.speedX = speedX;
            this.speedY = speedY;
            this.life = Math.random() * 60 + 30; // Thời gian tồn tại
            this.gravity = 0.05; // Lực hấp dẫn ảnh hưởng đến tia lửa
        }

        Spark.prototype.update = function() {
            this.x += this.speedX;
            this.y += this.speedY + this.gravity;
            this.size *= 0.96; // Giảm dần kích thước
            this.life--; // Giảm dần thời gian tồn tại
        };

        Spark.prototype.draw = function(ctx) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        };

        // Hàm tạo một quả pháo hoa
        function Firework(x, y) {
            this.x = x;
            this.y = y;
            this.sparks = []; // Mảng các tia lửa của quả pháo hoa này
            const numSparks = Math.floor(Math.random() * 50) + 50; // Số lượng tia lửa ngẫu nhiên
            const colors = ['#ff5733', '#33ff57', '#5733ff', '#f4ff33', '#ff33e3', '#fff']; // Các màu sắc pháo hoa
            for (let i = 0; i < numSparks; i++) {
                const angle = Math.random() * Math.PI * 2; // Góc bắn ngẫu nhiên
                const speed = Math.random() * 5 + 2; // Tốc độ ngẫu nhiên
                const color = colors[Math.floor(Math.random() * colors.length)]; // Chọn màu ngẫu nhiên
                this.sparks.push(new Spark(x, y, color, Math.random() * 3 + 1, Math.cos(angle) * speed, Math.sin(angle) * speed));
            }
        }

        Firework.prototype.update = function() {
            this.sparks.forEach(spark => spark.update());
            // Loại bỏ các tia lửa đã hết vòng đời
            this.sparks = this.sparks.filter(spark => spark.life > 0);
        };

        Firework.prototype.draw = function(ctx) {
            this.sparks.forEach(spark => spark.draw(ctx));
        };

        // Hàm chính để vẽ hiệu ứng hoạt ảnh
        function animate() {
            if (!isFireworksRunning) return; // Nếu đang tạm dừng, không vẽ nữa

            // Làm mờ khung hình trước để tạo hiệu ứng đuôi pháo hoa
            ctxFireworks.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctxFireworks.fillRect(0, 0, canvasFireworks.width, canvasFireworks.height);

            // Cập nhật và vẽ từng quả pháo hoa
            fireworks.forEach((firework, index) => {
                firework.update();
                firework.draw(ctxFireworks);
                // Loại bỏ quả pháo hoa đã nổ hết tia lửa
                if (firework.sparks.length === 0) {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(animate); // Yêu cầu khung hình tiếp theo
        }

        // Xử lý khi thay đổi kích thước cửa sổ
        window.addEventListener('resize', () => {
            canvasFireworks.width = window.innerWidth;
            canvasFireworks.height = window.innerHeight;
        });

        // Thêm pháo hoa khi click vào canvas
        canvasFireworks.addEventListener('click', (e) => {
            fireworks.push(new Firework(e.clientX, e.clientY));
        });

        // Khởi tạo hiệu ứng khi trang tải xong
        window.addEventListener('load', () => {
            animate(); // Bắt đầu vòng lặp hoạt ảnh
            // Thêm một vài pháo hoa ban đầu để trang trí
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    fireworks.push(new Firework(Math.random() * window.innerWidth, Math.random() * window.innerHeight / 2));
                }, i * 1000); // Hiển thị cách nhau 1 giây
            }
        });

        // Hàm để tạm dừng hoặc tiếp tục hiệu ứng pháo hoa
        function toggleFireworks() {
            isFireworksRunning = !isFireworksRunning;
            if (isFireworksRunning) {
                animate(); // Nếu bật lại, bắt đầu chạy lại
            }
        }

        // --- Xử lý sự kiện mở phong bì ---
        const envelope = document.getElementById('envelope');
        if (envelope) {
            envelope.addEventListener('click', () => {
                envelope.classList.toggle('open'); // Thêm/xóa lớp 'open' để kích hoạt animation
            });
        } else {
            console.error("Không tìm thấy phần tử phong bì với ID 'envelope'");
        }
    </script>
</body>
</html>
