<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kimanhiudau 💗</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#030005;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
#space{position:fixed;inset:0;z-index:-5;background:radial-gradient(circle at 50% 45%,#19051d 0,#050008 42%,#000 78%)}
.star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:tw var(--d) ease-in-out infinite alternate}.star.big{box-shadow:0 0 16px 3px #fff}@keyframes tw{to{opacity:.15;transform:scale(.45)}}
nav{position:fixed;z-index:50;top:0;width:100%;height:62px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;background:#050008aa;backdrop-filter:blur(9px)}nav a{color:#ffd2f2;text-decoration:none;margin:0 12px;text-shadow:0 0 12px #ff36c8}.brand{font-weight:800;color:#ff9ee8;text-shadow:0 0 16px #ff28c0;font-size:20px}.sound{font-size:23px;cursor:pointer}
.hero{height:100vh;min-height:680px;position:relative;overflow:hidden}.moon{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff8c5,#ffd44d 38%,#ff8b1e 74%,#e94d12);box-shadow:0 0 40px #ffbe52,0 0 120px #ff5b2477;animation:moon 5s ease-in-out infinite alternate}.moon:before{content:'🐰';position:absolute;left:53px;top:-48px;font-size:42px;filter:drop-shadow(0 0 9px #fff)}@keyframes moon{to{transform:translateX(-50%) translateY(-16px) scale(1.05)}}
.lantern{position:absolute;width:58px;height:78px;border-radius:50%;background:radial-gradient(circle,#fff8a9 0,#ffb522 30%,#ff5a19 68%,#b51d0b);box-shadow:0 0 22px #ff7a25,0 0 65px #ff551744;animation:swing 4.5s ease-in-out infinite alternate}.lantern:before{content:'';position:absolute;left:50%;top:-22px;height:24px;border-left:2px solid #d4ad70}.l1{left:9%;top:23%}.l2{right:10%;top:19%;animation-delay:-1.7s}.l3{left:27%;bottom:8%;transform:scale(.7)}.l4{right:26%;bottom:7%;transform:scale(.55);animation-delay:-2.7s}@keyframes swing{to{translate:18px -24px;rotate:7deg}}
.neon{position:absolute;color:#ff8de1;font-weight:800;white-space:nowrap;text-shadow:0 0 8px #ff4bc9,0 0 25px #ff1eac,0 0 45px #ff1eac66;animation:drift var(--t) ease-in-out infinite alternate}.n1{left:5%;top:18%;font-size:27px;--t:6s}.n2{right:5%;top:28%;font-size:24px;--t:7s}.n3{left:8%;bottom:25%;font-size:22px;--t:8s}.n4{right:7%;bottom:30%;font-size:23px;--t:9s}.n5{left:50%;top:54%;transform:translateX(-50%);font-size:28px;--t:6s}@keyframes drift{to{translate:28px -24px;rotate:4deg}}
.photo{position:absolute;padding:8px 8px 28px;background:#f5eee9;border-radius:5px;box-shadow:0 10px 35px #ff57c766,0 0 30px #ff78dd55;will-change:transform;transform-origin:50% 60%;animation:floatRotate var(--speed) ease-in-out infinite}.photo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:2px}.photo:after{content:attr(data-caption);position:absolute;bottom:6px;left:0;right:0;color:#6e5662;text-align:center;font-size:11px;font-weight:bold}
.p1{left:6%;top:34%;width:175px;height:220px;rotate:-8deg;--speed:6.2s}.p2{right:7%;top:39%;width:155px;height:200px;rotate:8deg;--speed:7.4s;animation-delay:-2s}.p3{left:34%;bottom:9%;width:145px;height:185px;rotate:5deg;--speed:6.8s;animation-delay:-1s}.p4{right:29%;top:30%;width:130px;height:170px;rotate:-6deg;--speed:8.2s;animation-delay:-3s}.p5{left:19%;top:12%;width:105px;height:140px;rotate:12deg;--speed:9s;animation-delay:-4s}.p6{right:22%;top:12%;width:100px;height:135px;rotate:-12deg;--speed:8.5s;animation-delay:-2.8s}.p7{right:13%;bottom:13%;width:105px;height:140px;rotate:10deg;--speed:10s;animation-delay:-6s}.p8{left:18%;bottom:13%;width:95px;height:128px;rotate:-12deg;--speed:9.5s;animation-delay:-5s}
@keyframes floatRotate{0%{transform:translate3d(0,0,0) rotate(-2deg)}25%{transform:translate3d(22px,-28px,0) rotate(6deg)}50%{transform:translate3d(-12px,-52px,0) rotate(-7deg)}75%{transform:translate3d(-28px,-20px,0) rotate(5deg)}100%{transform:translate3d(12px,8px,0) rotate(-4deg)}}
.heart{position:absolute;font-size:22px;filter:drop-shadow(0 0 10px #ff36c8);animation:heartFloat var(--h) ease-in-out infinite}.h1{left:18%;top:36%;--h:5s}.h2{right:18%;top:24%;--h:6s}.h3{left:50%;bottom:17%;--h:7s}@keyframes heartFloat{50%{transform:translate(22px,-45px) rotate(12deg) scale(1.25)}100%{transform:translate(-15px,-12px) rotate(-8deg)}}
.scroll{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:12px;color:#ffb8e9aa}.section{min-height:100vh;padding:110px 8%;display:flex;align-items:center;justify-content:center;text-align:center}.box{max-width:850px;padding:42px;border:1px solid #ff72d766;border-radius:28px;background:#ff40bd09;box-shadow:0 0 55px #ff39bd22;backdrop-filter:blur(8px)}h2{color:#ff9be4;text-shadow:0 0 15px #ff39bd;font-size:38px}.box p{font-size:19px;line-height:1.9;color:#ffe8f8}.start{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;transition:1s}.start button{border:1px solid #ff79d8;background:#ff45bd12;color:#ffc3ed;padding:16px 30px;border-radius:999px;font-size:18px;box-shadow:0 0 28px #ff3abd;cursor:pointer}.hidden{opacity:0;pointer-events:none}
@media(max-width:700px){nav a{display:none}.hero{min-height:650px}.moon{width:110px;height:110px}.moon:before{left:37px;font-size:31px}.photo{transform:scale(.72)}.p1{left:0;top:31%}.p2{right:-3%;top:40%}.p3{left:29%;bottom:8%}.p4{right:25%;top:28%}.p5,.p6,.p7,.p8{display:none}.neon{font-size:15px!important}.n5{top:52%}.lantern{scale:.8}}
</style></head>
<body>
<div id="space"></div>
<nav><div class="brand" id="brand">kimanhiudau 💗</div><div><a href="#home">Trang chủ</a><a href="#wish">Lời chúc</a><a href="#memory">Kỷ niệm</a></div><div id="sound" class="sound">🔇</div></nav>
<section class="hero" id="home">
<div class="moon"></div><div class="lantern l1"></div><div class="lantern l2"></div><div class="lantern l3"></div><div class="lantern l4"></div>
<div class="neon n1" id="text1"></div><div class="neon n2" id="text2"></div><div class="neon n3" id="text3"></div><div class="neon n4" id="text4"></div><div class="neon n5" id="text5"></div>
<div class="heart h1">💗</div><div class="heart h2">💖</div><div class="heart h3">💕</div>
<div class="photo p1" data-caption="i love you 💗"><img id="photo1"></div><div class="photo p2" data-caption="thương em 💕"><img id="photo2"></div><div class="photo p3" data-caption="mãi bên nhau"><img id="photo3"></div><div class="photo p4" data-caption="kimanhiudau"><img id="photo4"></div>
<div class="photo p5" data-caption="💗"><img id="photo5"></div><div class="photo p6" data-caption="✨"><img id="photo6"></div><div class="photo p7" data-caption="💕"><img id="photo7"></div><div class="photo p8" data-caption="🐰"><img id="photo8"></div>
<div class="scroll">⌄ Cuộn xuống</div></section>
<section class="section" id="wish"><div class="box"><h2 id="wishTitle"></h2><p id="wish1"></p><p id="wish2"></p><p id="wish3" style="font-size:28px;color:#ff9be4"></p></div></section>
<section class="section" id="memory"><div class="box"><h2 id="memoryTitle"></h2><p id="memoryText"></p></div></section>
<div class="start" id="start"><button id="openBtn">💗 Mở thư Trung Thu 💗</button></div>
<script src="config.js"></script>
<script>
const C=window.SITE_CONFIG;
document.title=C.title; document.getElementById('brand').textContent=C.brand;
C.texts.forEach((t,i)=>document.getElementById('text'+(i+1)).textContent=t);
C.photos.forEach((p,i)=>{const el=document.getElementById('photo'+(i+1)); el.src=p; el.onerror=()=>{el.src='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500"><rect width="100%" height="100%" fill="#28152b"/><text x="50%" y="50%" fill="#ff9be4" text-anchor="middle" font-size="30">Thêm ảnh '+(i+1)+'</text></svg>')}});
document.getElementById('wishTitle').textContent=C.wish.title;document.getElementById('wish1').textContent=C.wish.p1;document.getElementById('wish2').textContent=C.wish.p2;document.getElementById('wish3').textContent=C.wish.p3;document.getElementById('memoryTitle').textContent=C.memory.title;document.getElementById('memoryText').textContent=C.memory.text;
for(let i=0;i<180;i++){let s=document.createElement('i');s.className='star'+(Math.random()>.9?' big':'');let z=Math.random()*3+1;s.style.width=s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.opacity=.25+Math.random()*.75;s.style.setProperty('--d',(1.5+Math.random()*4)+'s');document.getElementById('space').appendChild(s)}
const audio=new Audio(C.music); audio.loop=true; audio.volume=.7; let playing=false;
async function playMusic(){try{await audio.play();playing=true;document.getElementById('sound').textContent='🔊'}catch(e){document.getElementById('sound').textContent='⚠️'}}
document.getElementById('openBtn').onclick=()=>{document.getElementById('start').classList.add('hidden');playMusic()};
document.getElementById('sound').onclick=async()=>{if(playing){audio.pause();playing=false;document.getElementById('sound').textContent='🔇'}else await playMusic()};
</script></body></html>
