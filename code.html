<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Trung Thu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4e8d1;
            margin: 0;
            overflow: hidden;
        }
        .envelope-container {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .envelope {
            width: 300px;
            height: 200px;
            background-color: #d2b48c;
            border-radius: 5px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.8s ease-in-out;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .envelope:hover {
            transform: translateY(-10px);
        }
        .envelope-flap {
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid #a08c6f;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top;
            transition: transform 0.8s ease-in-out;
        }
        .envelope-content {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: #f4e8d1;
            border-top: 1px dashed #a08c6f;
            overflow: hidden;
            transition: height 0.8s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .letter {
            text-align: center;
            color: #333;
            padding: 20px;
            box-sizing: border-box;
            transform: translateY(50px);
            opacity: 0;
            transition: transform 0.8s ease-in-out 0.5s, opacity 0.8s ease-in-out 0.5s;
        }
        .letter h2 {
            margin-bottom: 15px;
            color: #8b4513;
            font-size: 1.5em;
        }
        .letter p {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .envelope.open .envelope-flap {
            transform: rotateX(-180deg);
        }
        .envelope.open .envelope-content {
            height: 200px;
        }
        .envelope.open .letter {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="envelope-container">
        <div class="envelope" id="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-content">
                <div class="letter">
                    <h2>Trung Thu đến rồi...</h2>
                    <p>Anh chúc em của anh một ngày Lễ Trung Thu thật vui vẻ và hạnh phúc. Luôn vui vẻ yêu đời.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const envelope = document.getElementById('envelope');
        envelope.addEventListener('click', () => {
            envelope.classList.toggle('open');
        });
    </script>
</body>
</html>
